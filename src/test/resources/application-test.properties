# ============================================
# TEST PROFILE - Usa H2 em memoria
# ============================================

# H2 Database (em memoria, descartado apos teste)
# NON_KEYWORDS=VALUE evita conflito com coluna 'value' que e palavra reservada no H2
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE,KEY
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desabilitar Flyway (H2 nao precisa migrations)
spring.flyway.enabled=false

# Logging
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.br.com.rentafit=DEBUG

# Security (usuario de teste simples)
spring.security.user.name=test
spring.security.user.password=test

cors.allowed-origins=http://localhost:4200

rentafit.security.password-expiry-days=90

# Segredo exclusivo de teste (producao exige RENTFIT_JWT_SECRET via ambiente)
rentafit.security.jwt.secret=test-only-jwt-secret-not-for-production

# Placeholders exigidos por servicos fiscais em testes de integracao com contexto completo
nfs-e.sts.enabled=false
nfs-e.api.url=https://hom.example.com
nfs-e.prestador.cnpj=00000000000000
