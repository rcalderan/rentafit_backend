# ============================================
# TEST PROFILE - Usa H2 em memória
# ============================================

# H? Database (em memória, descartado após teste)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desabilitar Flyway (H2 não precisa migrations)
spring.flyway.enabled=false

# Logging (debug para ver SQL)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.br.com.rentafit=DEBUG

# Security (usuário de teste simples)
spring.security.user.name=test
spring.security.user.password=test

cors.allowed-origins=http://localhost:4200

