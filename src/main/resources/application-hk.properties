# ============================================================
#  Perfil HK  Homologação (banco Postgres local no container)
# ============================================================

# Banco de dados (Postgres iniciado pelo entrypoint.sh no mesmo container)
spring.datasource.url=jdbc:postgresql://localhost/rentafit
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Schema gerenciado pelo Flyway; ddl-auto=validate garante consistência
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# SSL / mTLS desabilitado em HK
server.ssl.enabled=false

# Logs mais detalhados para facilitar debugging em HK
logging.level.br.com.rentafit=DEBUG
logging.level.org.springframework.web=INFO

