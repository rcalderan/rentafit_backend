spring.datasource.url=jdbc:postgresql://localhost:5433/rentafit
spring.datasource.username=postgres
spring.datasource.password=1234567

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.main.allow-bean-definition-overriding=true

# Logging Configuration for Local Development
logging.level.root=INFO
logging.level.br.com.rentafit=DEBUG
logging.level.reactor.netty.http.client.HttpClient=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Show full exception stack traces
server.error.include-exception=true
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

spring.flyway.enabled=true

# ========== SPRING BATCH CONFIGURATION ==========
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-database=always

# ========== MIGRATION CONFIGURATION ==========
# Habilitar migracao (padrao: false - ativar apenas quando necessario)
migration.enabled=false

# Configuracoes do script Python de migracao
migration.python.executable=python3
migration.script.path=/app/migration/scripts/migrate.py
migration.bson.base-path=.legado/noivabd
migration.output-path=migration/output

# Pular validacoes pre-migracao
migration.skip-validation=false

# Pular limpeza pos-migracao
migration.skip-cleanup=false

# Habilitar auditoria
migration.audit-enabled=true

# Security Configuration
app.security.rsa.enabled=true
rentafit.security.jwt.secret=local-dev-secret-change-in-prod-must-be-at-least-32-chars

cors.allowed-origins=http://localhost,http://localhost:4200

