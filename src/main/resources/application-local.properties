spring.datasource.url=jdbc:postgresql://localhost:5433/rentafit
spring.datasource.username=postgres
spring.datasource.password=1234567

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.main.allow-bean-definition-overriding=true

# Logging Configuration for Local Development
logging.level.root=INFO
logging.level.br.com.rentafit=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Show full exception stack traces
server.error.include-exception=true
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

spring.flyway.enabled=true

# ========== SPRING BATCH CONFIGURATION ==========
spring.batch.job.enabled=true
spring.batch.jdbc.initialize-database=always

# ========== MIGRATION CONFIGURATION ==========
# Habilitar migracao (padrao: false - ativar apenas quando necessario)
migration.enabled=false

# Quais entidades migrar: cliente, funcionario, cliente,funcionario
migration.entities=cliente,funcionario

# Tamanho do chunk (lote) processado por vez
migration.batch.chunk-size=100

# Configuracao de retry
migration.batch.max-retries=3
migration.batch.retry-backoff-ms=1000
migration.batch.skip-limit=10

# Pular validacoes pre-migracao
migration.skip-validation=false

# Pular limpeza pos-migracao
migration.skip-cleanup=false

# Habilitar auditoria
migration.audit-enabled=true

# Configuracao de arquivos BSON
migration.bson.base-path=.legado/noivabd
migration.bson.cliente-file-name=cliente.bson
migration.bson.funcionario-file-name=funcionario.bson

# NFSe Nacional Configuration
nfs-e.api.url=${NFSE_API_URL:https://hom-nfse.svrs.rs.gov.br/}
nfs-e.sts.url=${NFSE_STS_URL:https://hom-nfse.svrs.rs.gov.br/api/token}
nfs-e.certificate.path=${NFSE_CERT_PATH:.cert/4c512503073b0d40.pfx}
nfs-e.certificate.password=${NFSE_CERT_PASSWORD:}

# NFS-e Via (Serpro) Configuration
nfs-e.via.recepcao.url=${NFSE_VIA_RECEPCAO_URL:https://hom-cert-api-nfsevia.np.estaleiro.serpro.gov.br/recepcao}
nfs-e.via.consultas.url=${NFSE_VIA_CONSULTAS_URL:https://hom-cert-api-nfsevia.np.estaleiro.serpro.gov.br/concessionarias}

# Security Configuration
app.security.rsa.enabled=true
