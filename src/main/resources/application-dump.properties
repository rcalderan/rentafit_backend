spring.datasource.url=jdbc:postgresql://localhost:5433/rentafit_dump
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:1234567}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

spring.main.allow-bean-definition-overriding=true

logging.level.root=INFO
logging.level.br.com.rentafit=DEBUG

server.error.include-exception=true
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

spring.flyway.enabled=true

migration.enabled=true
migration.python.executable=python
migration.script.path=migration/scripts/migrate.py
migration.bson.base-path=.legado/noivabd
migration.output.path=migration/output

cors.allowed-origins=http://localhost,http://localhost:4200

rentafit.security.jwt.secret=${RENTFIT_JWT_SECRET:local-dev-secret-change-in-prod-must-be-at-least-32-chars}
