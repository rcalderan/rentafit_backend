spring.application.name=Rentafit
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}/${DB_NAME:rentafit}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

server.error.include-stacktrace=never

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# NFS-e Nacional Configuration - URLs CORRIGIDAS
# IMPORTANTE: Use as URLs corretas do ambiente SVRS ou portal disponivel para seu estado
# Exemplos: hom-nfse.svrs.rs.gov.br, nfse.svrs.rs.gov.br, ou outro endpoint valido
nfs-e.api.url=${NFSE_API_URL:https://hom-nfse.svrs.rs.gov.br/}
nfs-e.sts.url=${NFSE_STS_URL:https://hom-nfse.svrs.rs.gov.br/api/token}
nfs-e.sts.enabled=${NFSE_STS_ENABLED:false}

# NFS-e Via (Serpro) Configuration
nfs-e.via.recepcao.url=${NFSE_VIA_RECEPCAO_URL:https://hom-cert-api-nfsevia.np.estaleiro.serpro.gov.br/recepcao}
nfs-e.via.consultas.url=${NFSE_VIA_CONSULTAS_URL:https://hom-cert-api-nfsevia.np.estaleiro.serpro.gov.br/concessionarias}

# NFS-e Sao Carlos (GINFES v3.01) Configuration
nfs-e.saocarlos.ambiente=${NFSE_SAOCARLOS_AMBIENTE:2}
nfs-e.saocarlos.url.homologacao=https://homologacao.ginfes.com.br/ServiceGinfesImpl
nfs-e.saocarlos.url.producao=https://producao.ginfes.com.br/ServiceGinfesImpl
nfs-e.saocarlos.prestador.cnpj=${NFSE_SAOCARLOS_CNPJ:00000000000000}
nfs-e.saocarlos.prestador.im=${NFSE_SAOCARLOS_IM:00000000}
nfs-e.saocarlos.codigo-municipio=6889
nfs-e.saocarlos.rps.serie=001
nfs-e.saocarlos.rps.numero-inicial=${NFSE_SAOCARLOS_RPS_INICIAL:1}

nfs-e.certificate.path=${NFSE_CERT_PATH:.cert/4c512503073b0d40.pfx}
nfs-e.certificate.password=${NFSE_CERT_PASSWORD:}
nfs-e.ambiente=${NFSE_AMBIENTE:2}
nfs-e.prestador.cnpj=${NFSE_PRESTADOR_CNPJ:00000000000000}
nfs-e.prestador.im=${NFSE_PRESTADOR_IM:}
nfs-e.tributos.ibs.aliquota=${NFSE_IBS_ALIQUOTA:0.025}
nfs-e.tributos.cbs.aliquota=${NFSE_CBS_ALIQUOTA:0.015}

# mTLS - Servidor aceita certificado do cliente (opcional para autenticacao A1)
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=${SERVER_KEYSTORE_PATH:}
server.ssl.key-store-password=${SERVER_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.client-auth=${SERVER_SSL_CLIENT_AUTH:want}
server.ssl.trust-store=${SERVER_TRUSTSTORE_PATH:}
server.ssl.trust-store-password=${SERVER_TRUSTSTORE_PASSWORD:}

# Sales Billing Configuration
rentafit.billing.auto-emit-on-payment=${SALES_AUTO_EMIT_NFSE:false}

# Legacy ID Configuration
rentafit.legacy-id.pattern=${RENTFIT_LEGACY_ID_PATTERN:yyMMdd}

# Spring Batch Configuration
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Security Configuration
app.security.rsa.enabled=${RSA_ENABLED:false}
rentafit.security.jwt.secret=${RENTFIT_JWT_SECRET:397a204e456c2d6f584e503348506b4d5a7130526e6132746f6c7a4d51624a35}
rentafit.security.jwt.issuer=rentafit-api
rentafit.security.jwt.expiration-hours=${RENTFIT_ACCESS_TOKEN_EXPIRATION_HOURS:2}
rentafit.security.jwt.refresh-expiration-days=${RENTFIT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
rentafit.security.password-expiry-days=${RENTFIT_PASSWORD_EXPIRY_DAYS:90}

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.viacep.register-health-indicator=true
resilience4j.circuitbreaker.instances.viacep.sliding-window-size=10
resilience4j.circuitbreaker.instances.viacep.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.viacep.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.viacep.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.viacep.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.viacep.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.viacep.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.instances.viacep.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.viacep.record-exceptions=org.springframework.web.reactive.function.client.WebClientResponseException,java.util.concurrent.TimeoutException

# Resilience4j Time Limiter Configuration
resilience4j.timelimiter.instances.viacep.timeout-duration=5s
resilience4j.timelimiter.instances.viacep.cancel-running-future=true

# Actuator endpoints for monitoring Circuit Breaker
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

