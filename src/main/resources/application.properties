spring.application.name=Rentafit
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}/${DB_NAME:rentafit}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

server.error.include-stacktrace=never

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# NFS-e Nacional Configuration
nfs-e.api.url=${NFSE_API_URL:https://hom.nfse.gov.br/via/}
nfs-e.sts.url=${NFSE_STS_URL:https://hom.nfse.gov.br/api/token}
nfs-e.sts.enabled=${NFSE_STS_ENABLED:true}
nfs-e.certificate.path=${NFSE_CERT_PATH:.cert/certificado.p12}
nfs-e.certificate.password=${NFSE_CERT_PASSWORD:}

# Spring Batch Configuration
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Security Configuration
app.security.rsa.enabled=${RSA_ENABLED:false}
rentafit.security.jwt.secret=${RENTFIT_JWT_SECRET:397a204e456c2d6f584e503348506b4d5a7130526e6132746f6c7a4d51624a35}
rentafit.security.jwt.issuer=rentafit-api
rentafit.security.jwt.expiration-hours=${RENTFIT_ACCESS_TOKEN_EXPIRATION_HOURS:2}
rentafit.security.jwt.refresh-expiration-days=${RENTFIT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
