spring.application.name=Rentafit
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}/${DB_NAME:rentafit}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

server.error.include-stacktrace=never

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# mTLS - Servidor aceita certificado do cliente (opcional para autenticacao A1)
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=${SERVER_KEYSTORE_PATH:}
server.ssl.key-store-password=${SERVER_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.client-auth=${SERVER_SSL_CLIENT_AUTH:want}
server.ssl.trust-store=${SERVER_TRUSTSTORE_PATH:}
server.ssl.trust-store-password=${SERVER_TRUSTSTORE_PASSWORD:}

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB

# Legacy ID Configuration
rentafit.legacy-id.pattern=${RENTFIT_LEGACY_ID_PATTERN:yyMMdd}

# Spring Batch Configuration
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# Security Configuration
app.security.rsa.enabled=${RSA_ENABLED:false}
# Sem fallback: aplicacao falha no boot se RENTFIT_JWT_SECRET nao estiver definido (SECURITY_ANALYSIS.md item 3)
rentafit.security.jwt.secret=${RENTFIT_JWT_SECRET}
rentafit.security.jwt.issuer=rentafit-api
rentafit.security.jwt.expiration-hours=${RENTFIT_ACCESS_TOKEN_EXPIRATION_HOURS:2}
rentafit.security.jwt.refresh-expiration-days=${RENTFIT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
rentafit.security.password-expiry-days=${RENTFIT_PASSWORD_EXPIRY_DAYS:90}

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.viacep.register-health-indicator=true
resilience4j.circuitbreaker.instances.viacep.sliding-window-size=10
resilience4j.circuitbreaker.instances.viacep.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.viacep.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.viacep.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.viacep.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.viacep.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.viacep.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.instances.viacep.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.viacep.record-exceptions=org.springframework.web.reactive.function.client.WebClientResponseException,java.util.concurrent.TimeoutException

# Resilience4j Time Limiter Configuration
resilience4j.timelimiter.instances.viacep.timeout-duration=5s
resilience4j.timelimiter.instances.viacep.cancel-running-future=true

# Actuator endpoints for monitoring Circuit Breaker
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

