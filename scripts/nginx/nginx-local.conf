worker_processes 1;
events { worker_connections 128; }

http {
    # --- Upstreams ---
    upstream rentafit {
        server rentafit:8080;
    }
    upstream costume_nfe {
        server costume-nfe:8081;
    }

    server {
        listen 80;
        server_name localhost;

        # --- Rentafit (passthrough direto, tem sua propria seguranca) ---
        location / {
            proxy_pass http://rentafit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- NFe: protegido por auth_request contra Rentafit ---
        location /nfe-api/ {
            auth_request /internal/validate-token;
            auth_request_set $auth_status $upstream_status;

            # Repassa o header Authorization original para o NFe
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Reescreve /nfe-api/* para /api/v1/nfe/* do costume-rental-nfe
            rewrite ^/nfe-api/(.*)$ /api/v1/nfe/$1 break;
            proxy_pass http://costume_nfe;
        }

        # --- Actuator do NFe (health check, sem auth) ---
        location /nfe-api/actuator/ {
            proxy_pass http://costume_nfe/actuator/;
            proxy_set_header Host $host;
        }

        # --- Internal: subrequest de validacao de token ---
        location = /internal/validate-token {
            internal;
            proxy_pass http://rentafit/api/auth/validate-token;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }
    }
}
