name: CI/CD Pipeline

on:
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened, closed ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    strategy:
      matrix:
        java-version: ['21']

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Para SonarQube necessita do histórico completo

    - name: Setup Java ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Display Java version
      run: java -version

    - name: Build with Maven (compile only)
      run: mvn clean compile -DskipTests

    - name: Run Unit Tests
      run: mvn test

    - name: Generate Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-${{ matrix.java-version }}
        path: target/surefire-reports/
        retention-days: 30

    - name: Run Integration Tests
      run: mvn verify -DskipUnitTests=false

#    - name: Code Quality Analysis (SonarQube)
#      if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'
#      run: |
#        mvn sonar:sonar \
#          -Dsonar.projectKey=rentafit \
#          -Dsonar.projectName=Rentafit \
#          -Dsonar.sources=src/main/java \
#          -Dsonar.tests=src/test/java
#      env:
#        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
#        SONAR_LOGIN: ${{ secrets.SONAR_LOGIN }}
#      continue-on-error: true  # Não interrompe se SonarQube falhar

    - name: Check Code Coverage
      run: mvn jacoco:report
      continue-on-error: true

  security-check:
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Dependency Check (OWASP)
      run: mvn org.owasp:dependency-check-maven:check -DskipProvidedScope=true
      continue-on-error: true

    - name: Upload Dependency Check Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: target/dependency-check-report.*
        retention-days: 30

  # ─── HK PIPELINE ────────────────────────────────────────────────────────────
  # Nova arquitetura: EC2 Spot Instance com Docker Compose
  # Infra criada via CloudFormation (ec2-hk.yaml, lambda-scheduler.yaml)
  # Deploy: push imagem ECR + upload compose para S3 + SSM RunCommand para deploy

  deploy-hk:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.base_ref == 'develop'
    env:
      ECR_REPOSITORY: rentafit-api-hk
      S3_BUCKET: ${{ secrets.S3_BUCKET_HK }}
      INSTANCE_ID: ${{ secrets.HK_INSTANCE_ID }}
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials for HK
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_HK }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_HK }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Verify EC2 Instance is running
      id: check-ec2
      run: |
        echo "Checking EC2 instance ${INSTANCE_ID}..."
        STATUS=$(aws ec2 describe-instances \
          --instance-ids "${INSTANCE_ID}" \
          --query 'Reservations[0].Instances[0].State.Name' \
          --output text 2>/dev/null || echo "not-found")

        if [ "$STATUS" != "running" ]; then
          echo "⚠️ EC2 instance is not running (status: ${STATUS})"
          echo "⏭️ Skipping deploy. Start the instance manually or wait for scheduler."
          echo "skip_deploy=true" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "✅ EC2 instance is running"
        echo "skip_deploy=false" >> $GITHUB_OUTPUT

    - name: Login to Amazon ECR
      if: steps.check-ec2.outputs.skip_deploy != 'true'
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      if: steps.check-ec2.outputs.skip_deploy != 'true'
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Substitute variables in docker-compose
      if: steps.check-ec2.outputs.skip_deploy != 'true'
      run: |
        envsubst < docker-compose.hk.yaml > docker-compose.hk.rendered.yml
        cat docker-compose.hk.rendered.yml
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        DB_PASSWORD: ${{ secrets.HK_DB_PASSWORD }}

    - name: Validate S3_BUCKET
      if: steps.check-ec2.outputs.skip_deploy != 'true'
      run: |
        if [ -z "${S3_BUCKET}" ]; then
          echo "❌ Secret S3_BUCKET_HK is not configured"
          exit 1
        fi
        echo "✅ S3 bucket: ${S3_BUCKET}"

    - name: Upload docker-compose to S3
      if: steps.check-ec2.outputs.skip_deploy != 'true'
      run: |
        aws s3 cp docker-compose.hk.rendered.yml s3://${S3_BUCKET}/hk/docker-compose.yml
        echo "Docker-compose uploaded to s3://${S3_BUCKET}/hk/docker-compose.yml"

    - name: Deploy via AWS Systems Manager (SSM)
      if: steps.check-ec2.outputs.skip_deploy != 'true'
      run: |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${INSTANCE_ID}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy Rentafit HK - ${{ github.sha }}" \
          --parameters commands=["cd /opt/rentafit && aws s3 cp s3://${S3_BUCKET}/hk/docker-compose.yml docker-compose.yml && aws ecr get-login-password | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }} && docker-compose pull app && docker-compose up -d && docker image prune -f"] \
          --output text \
          --query 'Command.CommandId')

        echo "SSM Command ID: ${COMMAND_ID}"
        echo "command_id=${COMMAND_ID}" >> $GITHUB_OUTPUT

        # Aguardar execucao
        echo "Aguardando execucao do deploy..."
        aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"

        # Verificar status
        STATUS=$(aws ssm get-command-invocation \
          --command-id "${COMMAND_ID}" \
          --instance-id "${INSTANCE_ID}" \
          --query 'Status' \
          --output text)

        if [ "$STATUS" = "Success" ]; then
          echo "Deploy realizado com sucesso!"
        else
          echo "Deploy falhou com status: ${STATUS}"
          exit 1
        fi


  # ─── NOTIFY ─────────────────────────────────────────────────────────────────

  notify:
    needs: [build, deploy-hk]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Notify on Success
      if: success()
      run: |
        echo "✅ Pipeline completed successfully!"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"

    - name: Notify on Failure
      if: failure()
      run: |
        echo "❌ Pipeline failed!"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
