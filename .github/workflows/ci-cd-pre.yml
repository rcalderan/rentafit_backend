name: CI/CD Pipeline

on:
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened, closed ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'docker-compose.hk.yaml'
      - '.github/workflows/ci-cd-pre.yml'
      - 'scripts/**'

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    strategy:
      matrix:
        java-version: ['21']

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history needed for SonarQube analysis

    - name: Setup Java ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Display Java version
      run: java -version

    - name: Build with Maven (compile only)
      run: mvn clean compile -DskipTests

    - name: Run Unit Tests
      run: mvn test

    - name: Generate Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-${{ matrix.java-version }}
        path: target/surefire-reports/
        retention-days: 7

    - name: Run Integration Tests
      run: mvn verify -DskipUnitTests=false

#    - name: Code Quality Analysis (SonarQube)
#      if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'
#      run: |
#        mvn sonar:sonar \
#          -Dsonar.projectKey=rentafit \
#          -Dsonar.projectName=Rentafit \
#          -Dsonar.sources=src/main/java \
#          -Dsonar.tests=src/test/java
#      env:
#        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
#        SONAR_LOGIN: ${{ secrets.SONAR_LOGIN }}
#      continue-on-error: true  # Don't fail the pipeline if SonarQube fails

    - name: Check Code Coverage
      run: mvn jacoco:report
      continue-on-error: true

  security-check:
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Dependency Check (OWASP)
      run: mvn org.owasp:dependency-check-maven:check -DskipProvidedScope=true
      continue-on-error: true

    - name: Upload Dependency Check Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: target/dependency-check-report.*
        retention-days: 7

  # ─── HK PIPELINE ────────────────────────────────────────────────────────────
  # Architecture: EC2 Spot Instance with Docker Compose
  # Infrastructure created via CloudFormation (ec2-hk.yaml, lambda-scheduler.yaml)
  # Deploy: Push ECR image + Upload compose to S3 + SSM RunCommand for deploy

  deploy-hk:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.base_ref == 'develop'
    env:
      ECR_REPOSITORY: rentafit-api-hk
      S3_BUCKET: ${{ secrets.S3_BUCKET_HK }}
      INSTANCE_ID: ${{ secrets.HK_INSTANCE_ID }}
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials for HK
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_HK }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_HK }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Verify EC2 Instance is running
      id: check-ec2
      run: |
        echo "Checking EC2 instance ${INSTANCE_ID}..."
        STATUS=$(aws ec2 describe-instances \
          --instance-ids "${INSTANCE_ID}" \
          --query 'Reservations[0].Instances[0].State.Name' \
          --output text 2>/dev/null || echo "not-found")

        if [ "$STATUS" != "running" ]; then
          echo "⚠️ EC2 instance is not running (status: ${STATUS})"
          echo "⏭️ Skipping deploy. Start the instance manually or wait for scheduler."
          echo "skip_deploy=true" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "✅ EC2 instance is running"
        echo "skip_deploy=false" >> $GITHUB_OUTPUT

    - name: Login to Amazon ECR
      if: steps.check-ec2.outputs.skip_deploy != 'true'
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      if: steps.check-ec2.outputs.skip_deploy != 'true'
      uses: docker/setup-buildx-action@v3

    - name: Build, tag, and push image to Amazon ECR
      if: steps.check-ec2.outputs.skip_deploy != 'true'
      id: build-image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false

    - name: Set image output
      if: steps.check-ec2.outputs.skip_deploy != 'true'
      id: set-output
      run: |
        echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

    - name: Substitute variables in docker-compose
      if: steps.check-ec2.outputs.skip_deploy != 'true'
      run: |
        envsubst < docker-compose.hk.yaml > docker-compose.hk.rendered.yml
        cat docker-compose.hk.rendered.yml
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        DB_PASSWORD: ${{ secrets.HK_DB_PASSWORD }}

    - name: Validate S3_BUCKET
      if: steps.check-ec2.outputs.skip_deploy != 'true'
      run: |
        if [ -z "${S3_BUCKET}" ]; then
          echo "❌ Secret S3_BUCKET_HK is not configured"
          exit 1
        fi
        echo "✅ S3 bucket: ${S3_BUCKET}"

    - name: Upload docker-compose to S3
      if: steps.check-ec2.outputs.skip_deploy != 'true'
      run: |
        aws s3 cp docker-compose.hk.rendered.yml s3://${S3_BUCKET}/hk/docker-compose.yml
        echo "Docker-compose uploaded to s3://${S3_BUCKET}/hk/docker-compose.yml"

    - name: Update deploy.sh on EC2 via SSM
      if: steps.check-ec2.outputs.skip_deploy != 'true'
      run: |
        SCRIPT=$(cat << 'HEREDOC'
        #!/bin/bash
        export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        set -e
        BUCKET="${S3_BUCKET_NAME:-}"
        REGION=$(curl -s http://169.254.169.254/latest/meta-data/placement/region)
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        echo "Bucket: ${BUCKET} | Region: ${REGION}"
        aws ecr get-login-password --region "${REGION}" | /usr/bin/docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
        aws s3 cp "s3://${BUCKET}/hk/docker-compose.yml" /opt/rentafit/docker-compose.yml --region "${REGION}"
        cd /opt/rentafit
        /usr/bin/docker compose pull app
        /usr/bin/docker compose up -d
        /usr/bin/docker image prune -f
        echo "=== Deploy concluido ==="
        HEREDOC
        )

        ENCODED=$(echo "$SCRIPT" | base64 -w 0)

        UPD_CMD=$(aws ssm send-command \
          --instance-ids "${INSTANCE_ID}" \
          --document-name "AWS-RunShellScript" \
          --comment "Update deploy.sh - ${{ github.sha }}" \
          --parameters "commands=[\"echo ${ENCODED} | base64 -d > /opt/rentafit/deploy.sh && chmod +x /opt/rentafit/deploy.sh && echo 'deploy.sh updated'\"]" \
          --output text \
          --query 'Command.CommandId')

        echo "Update Command ID: ${UPD_CMD}"

        for i in {1..12}; do
          UPD_STATUS=$(aws ssm get-command-invocation \
            --command-id "${UPD_CMD}" \
            --instance-id "${INSTANCE_ID}" \
            --query 'Status' \
            --output text 2>/dev/null || echo "Pending")
          echo "Update status: ${UPD_STATUS} ($i/12)"
          if [ "$UPD_STATUS" = "Success" ] || [ "$UPD_STATUS" = "Failed" ] || [ "$UPD_STATUS" = "Cancelled" ]; then
            break
          fi
          sleep 5
        done

        if [ "$UPD_STATUS" != "Success" ]; then
          echo "❌ Failed to update deploy.sh: ${UPD_STATUS}"
          exit 1
        fi

    - name: Deploy via AWS Systems Manager (SSM) with retry
      if: steps.check-ec2.outputs.skip_deploy != 'true'
      id: ssm-deploy
      run: |
        START_TIME=$(date +%s)
        echo "deploy_start_time=$START_TIME" >> $GITHUB_OUTPUT

        deploy_attempt() {
          echo "🚀 Sending SSM command..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Rentafit HK - ${{ github.sha }}" \
            --parameters "commands=[\"S3_BUCKET_NAME=${{ secrets.S3_BUCKET_HK }} /opt/rentafit/deploy.sh\"]" \
            --output text \
            --query 'Command.CommandId')

          echo "SSM Command ID: ${COMMAND_ID}"

          echo "⏳ Waiting for execution (polling for status)..."
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Status: ${STATUS} (poll $i/30)"

            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              break
            fi
            sleep 10
          done

          echo "Final status: ${STATUS}"

          if [ "$STATUS" = "Success" ]; then
            return 0
          else
            echo "=== ERROR OUTPUT ==="
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'StandardErrorContent' \
              --output text 2>/dev/null || echo "(No error output)"
            echo "=== STANDARD OUTPUT ==="
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'StandardOutputContent' \
              --output text 2>/dev/null || echo "(No output)"
            return 1
          fi
        }

        MAX_ATTEMPTS=3
        ATTEMPT=1
        DEPLOY_SUCCESS=false

        while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
          echo ""
          echo "🔄 Deploy attempt ${ATTEMPT}/${MAX_ATTEMPTS}"

          if deploy_attempt; then
            DEPLOY_SUCCESS=true
            break
          fi

          if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
            echo "⚠️ Attempt ${ATTEMPT} failed, waiting 30s before retry..."
            sleep 30
          fi
          ATTEMPT=$((ATTEMPT + 1))
        done

        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        echo "deploy_duration=$DURATION" >> $GITHUB_OUTPUT

        echo ""
        echo "⏱️ Total deploy duration: ${DURATION}s"
        echo "📊 Deploy attempts: ${ATTEMPT}/${MAX_ATTEMPTS}"

        if [ "$DEPLOY_SUCCESS" = "true" ]; then
          echo "✅ SSM deploy completed successfully!"
        else
          echo "❌ Deploy failed after ${MAX_ATTEMPTS} attempts"
          exit 1
        fi

    - name: Health Check
      if: steps.check-ec2.outputs.skip_deploy != 'true'
      id: health-check
      run: |
        echo "Waiting for application to start..."
        sleep 30

        PUBLIC_IP=$(aws ec2 describe-instances \
          --instance-ids "${INSTANCE_ID}" \
          --query 'Reservations[0].Instances[0].PublicIpAddress' \
          --output text)

        echo "Checking health at http://${PUBLIC_IP}:8080/actuator/health"

        for i in {1..10}; do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            "http://${PUBLIC_IP}:8080/actuator/health" 2>/dev/null || echo "000")

          if [ "$STATUS" = "200" ]; then
            echo "✅ Health check passed!"
            exit 0
          fi
          echo "Attempt $i/10 - Status: $STATUS"
          sleep 10
        done

        echo "❌ Health check failed after 10 attempts"
        exit 1

    - name: Job Summary
      if: always() && steps.check-ec2.outputs.skip_deploy != 'true'
      run: |
        echo "## 🚀 Deploy HK Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Deploy Duration | ${{ steps.ssm-deploy.outputs.deploy_duration }}s |" >> $GITHUB_STEP_SUMMARY
        echo "| Health Check | ${{ steps.health-check.outcome }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.health-check.outcome }}" = "success" ]; then
          echo "✅ Deploy completed successfully!" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Deploy failed - check logs" >> $GITHUB_STEP_SUMMARY
        fi


  # ─── NOTIFY ─────────────────────────────────────────────────────────────────

  notify:
    needs: [build, deploy-hk]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Notify on Success
      if: success()
      run: |
        echo "✅ Pipeline completed successfully!"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"

    - name: Notify on Failure
      if: failure()
      run: |
        echo "❌ Pipeline failed!"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
