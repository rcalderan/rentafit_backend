name: CI/CD Pipeline - Pre (HK)

on:
  pull_request:
    branches: [ develop, main ]
    types: [ opened, synchronize, reopened, closed ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.github/workflows/ci-cd-pre.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged == true

    strategy:
      matrix:
        java-version: ['21']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for SonarQube analysis

      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Display Java version
        run: java -version

      - name: Build with Maven (compile only)
        run: mvn clean compile -DskipTests

      - name: Run Unit Tests
        run: mvn test

      - name: Generate Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.java-version }}
          path: target/surefire-reports/
          retention-days: 7

      - name: Run Integration Tests
        run: mvn verify -DskipUnitTests=false

      - name: Check Code Coverage
        run: mvn jacoco:report
        continue-on-error: true

  security-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Dependency Check (OWASP)
        run: mvn org.owasp:dependency-check-maven:check -DskipProvidedScope=true
        continue-on-error: true

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 7

  publish-ghcr:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && (github.base_ref == 'develop' || github.base_ref == 'main')
    environment: develop
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, tag, and push image to GHCR
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rcalderan/rentafit-api:${{ github.sha }}
            ghcr.io/rcalderan/rentafit-api:latest
          cache-from: type=gha
          provenance: false

      - name: Set image output
        id: set-output
        run: |
          echo "image=ghcr.io/rcalderan/rentafit-api:${{ github.sha }}" >> $GITHUB_OUTPUT

  trigger-deploy:
    needs: [publish-ghcr]
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.base_ref == 'main' && (vars.DEPLOY_TARGET == '' || vars.DEPLOY_TARGET == 'HOSTINGER')
    steps:
      - name: Trigger Hostinger deploy
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.INFRA_REPO_PAT }}" \
            -H "Accept: application/vnd.github.everest-preview+json" \
            https://api.github.com/repos/rcalderan/costume-rental-infra/dispatches \
            -d "{\"event_type\":\"deploy-hostinger-pro\",\"client_payload\":{\"rentafit_image\":\"ghcr.io/rcalderan/rentafit-api:${{ github.sha }}\"}}"

  publish-ecr-legacy:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.base_ref == 'develop' && vars.DEPLOY_TARGET == 'AWS'
    environment: develop
    env:
      ECR_REPOSITORY: rentafit-api-hk
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials for HK
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_HK }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_HK }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          provenance: false

      - name: Set image output
        id: set-output
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Trigger deploy in costume-rental-infra (AWS legacy)
        continue-on-error: true
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.INFRA_REPO_PAT }}" \
            -H "Accept: application/vnd.github.everest-preview+json" \
            https://api.github.com/repos/rcalderan/costume-rental-infra/dispatches \
            -d "{\"event_type\":\"deploy-hk\",\"client_payload\":{\"image_uri\":\"${{ steps.set-output.outputs.image }}\"}}"

  notify:
    needs: [build, publish-ghcr, publish-ecr-legacy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify on Success
        if: success()
        run: |
          echo "✅ Pipeline completed successfully!"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Pipeline failed!"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
