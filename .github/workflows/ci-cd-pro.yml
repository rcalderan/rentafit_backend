name: CI/CD Pipeline

on:
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened, closed ]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged == true

    strategy:
      matrix:
        java-version: ['21']

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Para SonarQube necessita do histórico completo

    - name: Setup Java ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Display Java version
      run: java -version

    - name: Build with Maven (compile only)
      run: mvn clean compile -DskipTests

    - name: Run Unit Tests
      run: mvn test

    - name: Generate Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-${{ matrix.java-version }}
        path: target/surefire-reports/
        retention-days: 30

    - name: Run Integration Tests
      run: mvn verify -DskipUnitTests=false

#    - name: Code Quality Analysis (SonarQube)
#      if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'
#      run: |
#        mvn sonar:sonar \
#          -Dsonar.projectKey=rentafit \
#          -Dsonar.projectName=Rentafit \
#          -Dsonar.sources=src/main/java \
#          -Dsonar.tests=src/test/java
#      env:
#        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
#        SONAR_LOGIN: ${{ secrets.SONAR_LOGIN }}
#      continue-on-error: true  # Não interrompe se SonarQube falhar

    - name: Check Code Coverage
      run: mvn jacoco:report
      continue-on-error: true

  security-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action != 'closed'

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Dependency Check (OWASP)
      run: mvn org.owasp:dependency-check-maven:check -DskipProvidedScope=true
      continue-on-error: true

    - name: Upload Dependency Check Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: target/dependency-check-report.*
        retention-days: 30

  # ─── PRO PIPELINE ───────────────────────────────────────────────────────────
  # Os jobs vpc-hk/security-persistence-hk/deploy-hk pertencem ao ci-cd-pre.yml
  # (disparado em PRs para develop). Este arquivo gerencia apenas o deploy PRO
  # (PRs para master).

  deploy-pro:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.base_ref == 'master'
    env:
      ECR_REPOSITORY: rentafit-api-pro
      ECR_STACK_NAME: rentafit-pro-ecr
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials for PRO
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Ensure ECR repository (PRO)
      uses: aws-actions/aws-cloudformation-github-deploy@v1
      with:
        name: ${{ env.ECR_STACK_NAME }}
        template: .infrastructure/cloudformation/ecr-pro.yaml
        parameter-overrides: >-
          RepositoryName=${{ env.ECR_REPOSITORY }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    # C3: Stack RDS separado com --no-fail-on-empty-changeset para não recriar
    # o banco a cada merge (apenas aplica se houver mudança no template).
    - name: Ensure RDS Stack (PRO) — idempotente
      uses: aws-actions/aws-cloudformation-github-deploy@v1
      with:
        name: rentafit-pro-rds
        template: .infrastructure/cloudformation/rds-pro.yaml
        no-fail-on-empty-changeset: "1"
        parameter-overrides: >-
          VpcId=${{ secrets.AWS_VPC_ID }},
          PrivateSubnets=${{ secrets.AWS_PRIVATE_SUBNETS }},
          DBPassword=${{ secrets.PRO_DB_PASSWORD }}

    - name: Deploy ECS Stack (PRO)
      uses: aws-actions/aws-cloudformation-github-deploy@v1
      with:
        name: rentafit-pro-stack
        template: .infrastructure/cloudformation/ecs-pro.yaml
        no-fail-on-empty-changeset: "1"
        parameter-overrides: >-
          ImageUri=${{ steps.build-image.outputs.image }},
          VpcId=${{ secrets.AWS_VPC_ID }},
          PrivateSubnets=${{ secrets.AWS_PRIVATE_SUBNETS }},
          DbPasswordSecretArn=${{ secrets.PRO_DB_PASSWORD_SECRET_ARN }}

  # ─── NOTIFY ─────────────────────────────────────────────────────────────────

  notify:
    needs: [build, deploy-pro]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Notify on Success
      if: success()
      run: |
        echo "✅ Pipeline completed successfully!"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"

    - name: Notify on Failure
      if: failure()
      run: |
        echo "❌ Pipeline failed!"
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
