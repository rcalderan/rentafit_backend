AWSTemplateFormatVersion: '2010-09-09'
Description: 'OIDC Provider para GitHub Actions - Alternativa Segura a Access Keys'

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsHKRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubActionsHKRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - 'repo:rcalderan/rentafit:*'
                  - 'repo:rcalderan/Rentafit:*'
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
      ManagedPolicyArns:
        - !Ref HKDeployPolicy

  HKDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: RentafitHKDeployPolicy
      Description: 'Permissões mínimas para deploy em Homologação (HK)'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ECRAuthAndPush
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:DescribeRepositories
              - ecr:ListImages
            Resource: '*'
          - Sid: ECSTaskManagement
            Effect: Allow
            Action:
              - ecs:UpdateService
              - ecs:DescribeServices
              - ecs:RegisterTaskDefinition
              - ecs:DescribeTaskDefinition
              - ecs:ListTasks
              - ecs:DescribeTasks
            Resource:
              - !Sub 'arn:aws:ecs:*:${AWS::AccountId}:service/Rentafit-HK-Cluster/rentafit-hk-service'
              - !Sub 'arn:aws:ecs:*:${AWS::AccountId}:task-definition/rentafit-hk:*'
              - !Sub 'arn:aws:ecs:*:${AWS::AccountId}:cluster/Rentafit-HK-Cluster'
          - Sid: CloudFormationStackManagement
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:GetTemplate
              - cloudformation:ValidateTemplate
              - cloudformation:ListStackResources
            Resource:
              - !Sub 'arn:aws:cloudformation:*:${AWS::AccountId}:stack/rentafit-hk-stack/*'
          - Sid: IAMPassRole
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/rentafit-hk-task-role'
              - !Sub 'arn:aws:iam::${AWS::AccountId}:role/rentafit-hk-execution-role'
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com
          - Sid: EC2NetworkRead
            Effect: Allow
            Action:
              - ec2:DescribeVpcs
              - ec2:DescribeSubnets
              - ec2:DescribeSecurityGroups
              - ec2:DescribeNetworkInterfaces
            Resource: '*'
          - Sid: LogsAccess
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DescribeLogGroups
              - logs:PutRetentionPolicy
            Resource:
              - !Sub 'arn:aws:logs:*:${AWS::AccountId}:log-group:/ecs/rentafit-hk:*'
          - Sid: EFSDescribe
            Effect: Allow
            Action:
              - elasticfilesystem:DescribeFileSystems
              - elasticfilesystem:DescribeMountTargets
            Resource: '*'

Outputs:
  OIDCProviderArn:
    Description: ARN do OIDC Provider do GitHub
    Value: !Ref GitHubOIDCProvider
    Export:
      Name: GitHubOIDCProviderArn

  GitHubActionsRoleArn:
    Description: ARN da Role para GitHub Actions - HK
    Value: !GetAtt GitHubActionsHKRole.Arn
    Export:
      Name: GitHubActionsHKRoleArn

  Instructions:
    Description: Próximos passos
    Value: |
      1. Substitua 'SEU_USUARIO' pelo seu username do GitHub
      2. Deploy desta stack: aws cloudformation deploy --template-file oidc-setup.yaml --stack-name github-oidc --capabilities CAPABILITY_NAMED_IAM
      3. Use o ARN da Role no workflow do GitHub Actions

