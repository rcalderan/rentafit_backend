AWSTemplateFormatVersion: '2010-09-09'
Description: 'ECS Service para Homologação (HK) com Persistência Postgres via EFS'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  Subnets:
    Type: List<AWS::EC2::Subnet::Id>
  FileSystemId:
    Type: String
  EfsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group do EFS criado no stack de persistencia
  ExecutionRoleArn:
    Type: String
  TaskRoleArn:
    Type: String
  ImageUri:
    Type: String
    Default: 'public.ecr.aws/rentafit/api:latest'
  DbPasswordSecretArn:
    Type: String
    Description: ARN do secret no Secrets Manager para DB_PASSWORD
  AllowedIngressCidr:
    Type: String
    Default: ''
    Description: 'CIDR permitido para acesso ao app (ex: 203.0.113.10/32)'
  AppIngressSecurityGroupId:
    Type: String
    Default: ''
    Description: 'Security group permitido (ex: SG do ALB). Use este OU AllowedIngressCidr'

Conditions:
  UseIngressCidr: !Not [!Equals [!Ref AllowedIngressCidr, '']]
  UseIngressSecurityGroup: !Not [!Equals [!Ref AppIngressSecurityGroupId, '']]

Resources:
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: Rentafit-HK-Cluster

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/rentafit-hk
      RetentionInDays: 7

  HKTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: rentafit-hk
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref ExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: rentafit-api
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: hk
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Ref DbPasswordSecretArn
          MountPoints:
            - SourceVolume: pg_data
              ContainerPath: /var/lib/postgresql/data
              ReadOnly: false
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: ecs
      Volumes:
        - Name: pg_data
          EfsVolumeConfiguration:
            FileSystemId: !Ref FileSystemId
            TransitEncryption: ENABLED

  HKService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: rentafit-hk-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref HKTaskDefinition
      DesiredCount: 1 # Obrigatório 1 para evitar conflito de escrita no Postgres EFS
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED # Mudar para DISABLED se houver NAT Gateway
          Subnets: !Ref Subnets
          SecurityGroups:
            - !Ref AppSecurityGroup

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acesso app
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - !If
          - UseIngressSecurityGroup
          - IpProtocol: tcp
            FromPort: 8080
            ToPort: 8080
            SourceSecurityGroupId: !Ref AppIngressSecurityGroupId
          - !Ref 'AWS::NoValue'
        - !If
          - UseIngressCidr
          - IpProtocol: tcp
            FromPort: 8080
            ToPort: 8080
            CidrIp: !Ref AllowedIngressCidr
          - !Ref 'AWS::NoValue'

  EfsIngressFromAppSecurityGroup:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Permite NFS do SG da aplicacao para o SG do EFS
      GroupId: !Ref EfsSecurityGroupId
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !Ref AppSecurityGroup

Outputs:
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
