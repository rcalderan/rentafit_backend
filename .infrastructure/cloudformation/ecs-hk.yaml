AWSTemplateFormatVersion: '2010-09-09'
# ⚠️  Stack de criação MANUAL — NÃO executar pelo CI/CD
# Execute uma única vez via console AWS ou CLI:
#   aws cloudformation deploy \
#     --stack-name rentafit-hk-stack \
#     --template-file .infrastructure/cloudformation/ecs-hk.yaml \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides VpcId=vpc-xxx PublicSubnet=subnet-xxx DbPassword=suasenha
Description: 'ECS Cluster + Service para Homologacao (HK) - Single AZ, DB no container'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: 'ID da VPC criada pelo stack vpc.yaml'

  PublicSubnet:
    Type: AWS::EC2::Subnet::Id
    Description: 'Subnet publica (saida para internet) - do stack vpc.yaml'

  ImageUri:
    Type: String
    Default: ''
    Description: 'URI da imagem ECR (ex: 123456789.dkr.ecr.us-east-1.amazonaws.com/rentafit-api-hk:latest)'

  DbPassword:
    Type: String
    NoEcho: true
    Description: 'Senha do PostgreSQL local no container'

Resources:

  # --- IAM -------------------------------------------------------------------

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: RentafitHK-ECSTaskExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # --- LOGGING ---------------------------------------------------------------

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/rentafit-hk
      RetentionInDays: 7

  # --- SECURITY GROUP --------------------------------------------------------

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Acesso publico porta 8080 - ambiente HK'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
          Description: 'API publica HK'
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: 'Saida irrestrita'
      Tags:
        - Key: Name
          Value: Rentafit-HK-App-SG

  # --- ECS -------------------------------------------------------------------

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: Rentafit-HK-Cluster

  HKTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: rentafit-hk
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: rentafit-api
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: hk
            - Name: DB_PASSWORD
              Value: !Ref DbPassword
            - Name: DB_HOST
              Value: localhost
            - Name: DB_USER
              Value: postgres
            - Name: DB_NAME
              Value: rentafit
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: ecs

  HKService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: rentafit-hk-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref HKTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet
          SecurityGroups:
            - !Ref AppSecurityGroup

Outputs:
  ClusterName:
    Value: !Ref ECSCluster
    Description: 'Nome do cluster ECS HK'
  ServiceName:
    Value: !GetAtt HKService.Name
    Description: 'Nome do service ECS HK'
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
    Description: 'SG da aplicacao'