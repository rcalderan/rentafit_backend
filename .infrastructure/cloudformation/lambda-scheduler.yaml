AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lambda Functions para Start/Stop agendado do EC2 Rentafit HK'

Parameters:
  InstanceId:
    Type: String
    Description: 'ID da instancia EC2 a ser gerenciada (ex: i-0123456789abcdef0)'

  StartCron:
    Type: String
    Description: 'Expressao cron para iniciar (UTC-3). Padrao: 08:00 de segunda a sexta'
    Default: '0 11 ? * MON-FRI *'  # 11:00 UTC = 08:00 UTC-3

  StopCron:
    Type: String
    Description: 'Expressao cron para parar (UTC-3). Padrao: 18:00 de segunda a sexta'
    Default: '0 21 ? * MON-FRI *'  # 21:00 UTC = 18:00 UTC-3

Resources:

  # --- IAM ROLE PARA LAMBDA ---
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Rentafit-HK-Scheduler-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EC2StartStopPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:DescribeInstances
                Resource: '*'
                Condition:
                  StringEquals:
                    'ec2:ResourceTag/Name': 'Rentafit-HK-Server'

  # --- LAMBDA START ---
  StartInstanceFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: rentafit-hk-start
      Description: 'Inicia a instancia EC2 Rentafit HK'
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          INSTANCE_ID: !Ref InstanceId
          TZ: America/Sao_Paulo
      Code:
        ZipFile: |
          import boto3
          import os
          from datetime import datetime

          ec2 = boto3.client('ec2')
          INSTANCE_ID = os.environ['INSTANCE_ID']

          def lambda_handler(event, context):
              try:
                  print(f"[{datetime.now()}] Iniciando instancia {INSTANCE_ID}...")

                  response = ec2.start_instances(InstanceIds=[INSTANCE_ID])

                  current_state = response['StartingInstances'][0]['CurrentState']['Name']
                  previous_state = response['StartingInstances'][0]['PreviousState']['Name']

                  print(f"Estado anterior: {previous_state}")
                  print(f"Estado atual: {current_state}")

                  return {
                      'statusCode': 200,
                      'body': {
                          'message': f'Instancia {INSTANCE_ID} iniciada',
                          'previousState': previous_state,
                          'currentState': current_state
                      }
                  }
              except Exception as e:
                  print(f"Erro ao iniciar instancia: {str(e)}")
                  raise

  # --- LAMBDA STOP ---
  StopInstanceFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: rentafit-hk-stop
      Description: 'Para a instancia EC2 Rentafit HK'
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          INSTANCE_ID: !Ref InstanceId
          TZ: America/Sao_Paulo
      Code:
        ZipFile: |
          import boto3
          import os
          from datetime import datetime

          ec2 = boto3.client('ec2')
          INSTANCE_ID = os.environ['INSTANCE_ID']

          def lambda_handler(event, context):
              try:
                  print(f"[{datetime.now()}] Parando instancia {INSTANCE_ID}...")

                  response = ec2.stop_instances(InstanceIds=[INSTANCE_ID])

                  current_state = response['StoppingInstances'][0]['CurrentState']['Name']
                  previous_state = response['StoppingInstances'][0]['PreviousState']['Name']

                  print(f"Estado anterior: {previous_state}")
                  print(f"Estado atual: {current_state}")

                  return {
                      'statusCode': 200,
                      'body': {
                          'message': f'Instancia {INSTANCE_ID} parada',
                          'previousState': previous_state,
                          'currentState': current_state
                      }
                  }
              except Exception as e:
                  print(f"Erro ao parar instancia: {str(e)}")
                  raise

  # --- EVENTBRIDGE RULE - START ---
  StartScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: rentafit-hk-start-schedule
      Description: 'Agendamento para iniciar instancia HK'
      ScheduleExpression: !Sub 'cron(${StartCron})'
      State: ENABLED
      Targets:
        - Id: StartLambdaTarget
          Arn: !GetAtt StartInstanceFunction.Arn

  # --- EVENTBRIDGE RULE - STOP ---
  StopScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: rentafit-hk-stop-schedule
      Description: 'Agendamento para parar instancia HK'
      ScheduleExpression: !Sub 'cron(${StopCron})'
      State: ENABLED
      Targets:
        - Id: StopLambdaTarget
          Arn: !GetAtt StopInstanceFunction.Arn

  # --- PERMISSOES EVENTBRIDGE -> LAMBDA ---
  StartLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StartInstanceFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StartScheduleRule.Arn

  StopLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StopInstanceFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt StopScheduleRule.Arn

Outputs:
  StartFunctionArn:
    Description: 'ARN da funcao Start'
    Value: !GetAtt StartInstanceFunction.Arn

  StopFunctionArn:
    Description: 'ARN da funcao Stop'
    Value: !GetAtt StopInstanceFunction.Arn

  StartRuleName:
    Description: 'Nome da regra de agendamento Start'
    Value: !Ref StartScheduleRule

  StopRuleName:
    Description: 'Nome da regra de agendamento Stop'
    Value: !Ref StopScheduleRule
